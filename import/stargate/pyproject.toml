[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stargate"
version = "0.1.0"
description = "A tool that converts REST APIs into MCP servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Stargate Team" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "openapi",
    "postman",
    "api",
    "ai",
    "claude",
    "converter"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
stargate = "stargate.cli:main"

[project.urls]
Homepage = "https://github.com/stargate/stargate"
Documentation = "https://github.com/stargate/stargate#readme"
Repository = "https://github.com/stargate/stargate"

[tool.hatch.build.targets.wheel]
packages = ["src/stargate"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
