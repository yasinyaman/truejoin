# The sample setup in one command: two databases on two engines (a PostgreSQL
# with the smoke check's made-up bank data, a MySQL with a CRM's), and Truejoin
# built from this checkout, with every console page on. A query may join the
# two: scripts/demo/README.md has the report that does.
#
#   docker compose -f scripts/demo/docker-compose.yml up --build -d --wait
#
# Then http://localhost:8000/ui, with a key from scripts/demo/config.yaml
# (DEMO_PORT=8080 in front of the command serves it there instead).
# `... down` stops it; `... down -v` also forgets what it wrote.
#
# For a look at the product on your own machine, not for a server: the keys in
# config.yaml are samples written in a public repository, which is why the port
# is bound to this machine alone.
name: truejoin-demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smoke
      POSTGRES_DB: smoke
      POSTGRES_PASSWORD: smoke
    volumes:
      - ../../docker/smoke/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoke -d smoke"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The second database, on another engine. The image's first start runs a
  # server without a network port while it loads crm.sql, so asking over TCP
  # says "healthy" only once the real one is up.
  crm:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./crm.sql:/docker-entrypoint-initdb.d/01-crm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucrm -pcrm --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  api:
    build:
      context: ../..
      args:
        WITH_MSSQL_ODBC: "0"
    image: truejoin:demo
    depends_on:
      db:
        condition: service_healthy
      crm:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_PORT:-8000}:8000"
    environment:
      # Neither production (which refuses sample keys) nor development (which
      # reloads on a file change, and nothing changes inside an image).
      APP_ENV: demo
      CONFIG_PATH: /app/config/demo.yaml
      DEMO_DB_HOST: db
      DEMO_MYSQL_HOST: crm
      DEMO_DIR: /app
    volumes:
      - ./config.yaml:/app/config/demo.yaml:ro
      - ./catalogs:/app/seed/catalogs:ro
      - data:/app/data
      - logs:/app/logs
      - catalogs:/app/catalogs
    # Two things happen once, on the first start, and are kept in the volumes:
    # the key that encrypts what the console stores is made (so none is written
    # in this repository), and the approved sample catalogs are copied to where a
    # review may change them. A catalog this setup gains later is copied on the
    # next start; one already there is left as its reviewers have it. Written here rather than in a script file, which a
    # Windows checkout would give line endings a shell cannot read.
    command:
      - sh
      - -c
      - |
        set -e
        umask 077
        [ -s /app/data/secret.key ] || python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > /app/data/secret.key
        python -c "
        from truejoin.adapters.outbound.catalog_store.file_store import CatalogFileStore as Store
        seed, kept = Store('/app/seed/catalogs'), Store('/app/catalogs')
        for name in sorted(set(seed.list_catalogs()) - set(kept.list_catalogs())):
            kept.save(seed.load(name))
        "
        TRUEJOIN_SECRET_KEY="$$(cat /app/data/secret.key)" exec truejoin serve
    healthcheck:
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 5s

volumes:
  data:
  logs:
  catalogs:
