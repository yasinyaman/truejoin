# The sample setup: two databases on two engines (a PostgreSQL with
# docker/smoke/init.sql, a MySQL with scripts/demo/crm.sql) and their approved
# catalogs, in development mode with every console page on. It is what
# `docker compose -f scripts/demo/docker-compose.yml up` serves and what the
# README's demo videos are recorded on. See scripts/demo/README.md.
#
# DEMO_DB_HOST, DEMO_MYSQL_HOST and DEMO_DIR say where the databases are and
# where this setup writes; unset, they are on localhost and ./demo-out, for
# running from source at the repository's root.
#
# Not a configuration to deploy: the keys below are samples written in a public
# repository, the database password is the sample database's, and production
# would refuse this file for more than one reason.
databases:
  - name: smoke
    type: postgresql
    # The compose file (docker-compose.yml) names the database's service here.
    host: ${DEMO_DB_HOST:localhost}
    port: 5432
    database: smoke
    username: smoke
    password: smoke
    options: {pool_size: 4, ssl: false}
  # A second database on another engine (scripts/demo/crm.sql): the two know
  # nothing of each other, and a query may join their tables.
  - name: crm
    type: mysql
    host: ${DEMO_MYSQL_HOST:localhost}
    port: 3306
    database: crm
    username: crm
    password: crm
    options: {pool_size: 4}

settings:
  auto_discover_tables: true
  # The built-in assistant is off here: the sample setup needs no model. To try
  # it, point `llm` at one that can call tools and turn `olap.assistant` on
  # (docs/docs/assistant.md). A model of your own:
  #   llm: {reasoning: {provider: ollama, model: qwen2.5:14b, base_url: http://localhost:11434}}
  # and below, under `olap:`
  #   assistant: {enabled: true}
  # A cloud model also needs `analysis: {share_samples_with_cloud_llm: true}`.
  auth:
    enabled: true
    public_paths: ["/health"]
    api_keys:
      # A tenant's analyst: its own rows of two tables, national ids masked.
      - key: demo-tenant-a-4f1c9d27b6e0
        name: tenant_a
        tenant: a
        permissions: [read, query]
        row_filters:
          musteriler: [{column: kiraci, value: a}]
          islemler: [{column: kiraci, value: a}]
          musteri_segmentleri: [{column: kiraci, value: a}]
      - key: demo-admin-6c2f8b15e7d3
        name: admin
        permissions: [all]
      # The key the agent in the second video runs as: the same tenant's rows.
      - key: demo-claude-a-91d3f07b5c2e
        name: claude-agent
        tenant: a
        permissions: [read, query]
        row_filters:
          musteriler: [{column: kiraci, value: a}]
          islemler: [{column: kiraci, value: a}]
          musteri_segmentleri: [{column: kiraci, value: a}]
    key_store: ${DEMO_DIR:demo-out}/data/keys.json
    users:
      store: ${DEMO_DIR:demo-out}/data/users.json
  masking:
    enabled: true
    rules: {tc_no: last4, phone: partial}
  audit:
    enabled: true
    file: ${DEMO_DIR:demo-out}/logs/audit.jsonl
  catalog:
    # A copy of scripts/demo/catalogs: reviewing here must not change the checked-in one.
    storage_path: ${DEMO_DIR:demo-out}/catalogs
    auto_cross_reference: false
  database_store:
    path: ${DEMO_DIR:demo-out}/data/databases.json
  settings_store:
    path: ${DEMO_DIR:demo-out}/data/settings.json

olap:
  memory_limit: 512MB
  threads: 2
  temp_directory: ${DEMO_DIR:demo-out}/data/tmp
  grounding: repair
  terms: "on"

mcp:
  profile: analyst
