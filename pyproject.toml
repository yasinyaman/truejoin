[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truejoin"
dynamic = ["version"]
description = "Governed access to corporate databases for AI agents: MCP server, REST API and DuckDB OLAP with row-level security, masking and audit"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{ name = "Yasin Yaman", email = "yasnyaman@gmail.com" }]
keywords = [
    "mcp", "model-context-protocol", "mcp-server", "llm", "ai-agents", "text-to-sql",
    "semantic-layer", "data-catalog", "row-level-security", "data-masking", "audit",
    "duckdb", "olap", "rest-api", "openapi", "postgresql", "mysql", "oracle", "sql-server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    # olap (Fusion)
    "duckdb>=1.5,<2",
    "pyarrow>=25.0.1,<26",
    "sqlglot>=30.0,<31",
    "requests>=2.34,<3",
    # gateway + catalog (Warp)
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.53,<1.0",
    "slowapi>=0.1.10,<0.2",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0.1",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28,<1",
    # Bearer tokens from an OpenID Connect provider (auth.oidc).
    "pyjwt[crypto]>=2.10,<3",
    # Sign-in against a directory (auth.ldap): lldap, OpenLDAP, Active Directory.
    "ldap3>=2.9.1,<3",
    "click>=8.1.0",
    # mcp (Fusion server + Stargate converter)
    "mcp[cli]>=2.2,<3",
    "rich>=13.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
llm = ["openai>=1.12.0", "anthropic>=0.18.0", "google-genai>=1.0.0"]
# SQL Server / Oracle through ODBC; the driver itself is a system package.
odbc = ["aioodbc>=0.5.0"]
pandas = ["pandas>=3.0,<4"]
demo = ["truejoin[pandas]", "numpy>=2.5,<3"]
docs = ["mkdocs>=1.5.0", "mkdocs-material>=9.5.0", "mkdocstrings[python]>=0.24.0"]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.8,<0.17",
    "mypy>=2.3,<3",
    "responses>=0.26.3,<1",
    "pip-audit>=2.7",
    "types-PyYAML>=6.0",
    "testcontainers[postgres,mysql]>=4.0",
]
all = ["truejoin[llm,odbc,pandas,demo,docs,dev]"]

[project.urls]
Homepage = "https://github.com/yasinyaman/truejoin"
Documentation = "https://github.com/yasinyaman/truejoin/tree/main/docs/docs"
Repository = "https://github.com/yasinyaman/truejoin"
Changelog = "https://github.com/yasinyaman/truejoin/blob/main/CHANGELOG.md"
Issues = "https://github.com/yasinyaman/truejoin/issues"

[project.scripts]
truejoin = "truejoin.adapters.inbound.cli.main:main"

[tool.hatch.version]
path = "truejoin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["truejoin"]

[tool.hatch.build.targets.sdist]
include = ["/truejoin", "/config"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI Depends() in argument defaults. E501: ruff format owns line
# length (Warp's choice). UP042/UP046: str-Enum and Generic[] in Warp/Stargate
# code; rewriting them is churn, not value.
ignore = ["B008", "E501", "UP042", "UP046"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# The pure layers must type-check strictly; adapters may stay looser.
module = ["truejoin.domain.*", "truejoin.ports.*", "truejoin.application.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# shortcut: Stargate never ran mypy; its 19 findings (pydantic alias kwargs,
# missing annotations) are left as they were. Type them when the mcpgen
# services are touched in Phase 2, then delete this block.
module = [
    "truejoin.domain.mcp.*",
    "truejoin.application.mcpgen.*",
    "truejoin.adapters.outbound.mcp_gateway.*",
    "truejoin.adapters.inbound.mcp.mcp_sdk_host",
    "truejoin.adapters.inbound.cli.mcpgen",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "-m", "not integration"]
markers = [
    "integration: needs Docker (testcontainers spin up PostgreSQL/MySQL/SQL Server)",
]
filterwarnings = [
    "error::DeprecationWarning:truejoin.*",
]

[tool.coverage.run]
source = ["truejoin"]

[tool.coverage.report]
fail_under = 80
show_missing = true
