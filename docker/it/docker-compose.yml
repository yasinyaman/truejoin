# Oracle and SQL Server for the integration tests, and the runner that has
# their ODBC drivers. See README.md beside this file; `make it-up`, `make it`.
name: trio-it

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: Warp_Integr4tion1
      APP_USER: warp
      APP_USER_PASSWORD: Warp_Integr4tion1
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # x86-64 only: on Apple Silicon this needs Rosetta in Docker Desktop.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Warp_Integr4tion!"
      MSSQL_PID: Developer
    healthcheck:
      # Healthy means the tests' database exists, not only that the server answers.
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -U sa -P "$$MSSQL_SA_PASSWORD"
          -Q "IF DB_ID('warp') IS NULL CREATE DATABASE warp" || exit 1
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  runner:
    build:
      context: ../..
      dockerfile: docker/it/Dockerfile
    profiles: [run]
    depends_on:
      oracle:
        condition: service_healthy
      mssql:
        condition: service_healthy
    volumes:
      - ../..:/app:ro
    tmpfs: [/tmp]
    environment:
      # An engine that cannot be reached is a failure here, not a skip.
      WARP_REQUIRE_ORACLE: "1"
      WARP_REQUIRE_MSSQL: "1"
      WARP_ORACLE_HOST: oracle
      WARP_ORACLE_PORT: "1521"
      WARP_ORACLE_SERVICE: FREEPDB1
      WARP_ORACLE_USER: warp
      WARP_ORACLE_PASSWORD: Warp_Integr4tion1
      WARP_MSSQL_HOST: mssql
      WARP_MSSQL_PORT: "1433"
      WARP_MSSQL_DATABASE: warp
      WARP_MSSQL_USER: sa
      WARP_MSSQL_PASSWORD: "Warp_Integr4tion!"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    # PostgreSQL and MySQL skip themselves in here: there is no Docker to
    # start them with. They run on the host, as they always did.
    command: ["python", "-m", "pytest", "tests", "-m", "integration", "-q", "-rs"]
