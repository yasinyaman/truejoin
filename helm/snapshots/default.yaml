data:
  database.yaml: |
    databases: []
    mcp:
      profile: analyst
    olap:
      temp_directory: /app/data/tmp
    settings:
      audit:
        enabled: true
        file: /app/logs/audit.jsonl
      auth:
        api_keys: []
        enabled: true
        public_paths:
        - /health
      catalog:
        storage_path: /app/catalogs

