---
# Source: trio/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: trio
  labels:
    helm.sh/chart: trio-1.0.0
    app.kubernetes.io/name: trio
    app.kubernetes.io/instance: trio
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  database.yaml: |
    databases:
    - database: CORE
      host: ora.internal
      name: core
      password: ${file:/run/secrets/trio/db-password}
      port: 1521
      type: oracle
      username: trio_ro
    mcp:
      profile: analyst
    olap:
      grounding: repair
      temp_directory: /app/data/tmp
    settings:
      audit:
        enabled: true
        file: /app/logs/audit.jsonl
      auth:
        api_keys:
        - key: ${file:/run/secrets/trio/analyst-key}
          name: analyst
          permissions:
          - read
          - query
        enabled: true
        public_paths:
        - /health
      catalog:
        storage_path: /app/catalogs
      masking:
        enabled: true
        hash_secret: ${file:/run/secrets/trio/hash-secret}
        rules:
          tc_no: last4

