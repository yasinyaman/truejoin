# Source: trio/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trio
  labels:
    helm.sh/chart: trio-1.0.0
    app.kubernetes.io/name: trio
    app.kubernetes.io/instance: trio
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trio
      app.kubernetes.io/instance: trio
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        -
          ipBlock:
            cidr: 10.0.12.0/24
      ports:
        - port: 1521
          protocol: TCP

