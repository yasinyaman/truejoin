apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trio.fullname" . }}
  labels:
    {{- include "trio.labels" . | nindent 4 }}
spec:
  # One process holds the loaded data and the catalog it started with.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "trio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trio.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A changed configuration restarts the pod: it is read once, at start.
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "trio.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: trio
          image: {{ include "trio.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["trio", "serve"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CONFIG_PATH
              value: /app/config/database.yaml
            - name: API_PORT
              value: "8000"
            {{- if not (hasKey .Values.env "APP_ENV") }}
            - name: APP_ENV
              value: production
            {{- end }}
            {{- range $name, $value := .Values.env }}
            {{- if not (or (kindIs "string" $value) (kindIs "bool" $value)) }}
            {{- fail (printf "env.%s must be a quoted string: Helm reads %v as a number and may write it changed (2e+07, 493)" $name $value) }}
            {{- end }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet: {path: /health, port: http}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet: {path: /health, port: http}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: catalogs
              mountPath: /app/catalogs
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
            {{- if include "trio.secretName" . }}
            - name: secrets
              mountPath: /run/secrets/trio
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "trio.fullname" . }}
        {{- include "trio.volume" (list . "catalogs") | nindent 8 }}
        {{- include "trio.volume" (list . "data") | nindent 8 }}
        {{- include "trio.volume" (list . "logs") | nindent 8 }}
        - name: tmp
          emptyDir: {}
        {{- if include "trio.secretName" . }}
        - name: secrets
          secret:
            secretName: {{ include "trio.secretName" . }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
