{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trio.fullname" . }}
  labels:
    {{- include "trio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.create }}
  {{- if not (kindIs "string" $value) }}
  {{- fail (printf "secrets.create.%s must be a quoted string: Helm reads %v as a number and would store it changed" $key $value) }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
