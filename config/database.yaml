# truejoin - what the server reads before anything else.
#
# Everything not written here is set from the console (Settings tab, admin
# key), kept in settings_store with its secrets encrypted, and served at once.
# Databases can be added there too (Databases tab). A setting written in this
# file is locked in the console. config/reference.yaml lists every setting;
# docs/docs/configuration.md says which belong here.
#
# ${VAR:default} reads the environment, ${file:/path} a mounted secret.
# TRUEJOIN_SECRET_KEY (a Fernet key) encrypts the passwords and keys the
# console keeps:
#   python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'

databases:
  - name: primary_db
    type: postgresql
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:myapp}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:}
    readonly_username: ${DB_READONLY_USER:}
    readonly_password: ${DB_READONLY_PASS:}

settings:
  api_prefix: /api/v1

  # Who may come in. Kept here so nobody can lock everyone out from the console.
  auth:
    enabled: ${AUTH_ENABLED:false}
    public_paths: [/health, /docs, /redoc, /openapi.json]
    api_keys:
      - key: ${API_KEY_ADMIN:}
        name: admin
        permissions: [all]
    key_store: ./data/keys.json            # keys handed out from the console

  # The trail is switched on here, so nobody can switch it off from the console.
  audit:
    enabled: false
    file: ./logs/audit.jsonl

  catalog:
    storage_path: ./catalogs
  database_store:
    path: ./data/databases.json            # databases added from the console
  settings_store:
    path: ./data/settings.json             # settings changed from the console

olap:
  database: ":memory:"
  memory_limit: 4GB
  threads: 4

mcp:
  http_path: /mcp
