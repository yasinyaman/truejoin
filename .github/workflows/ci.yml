name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default token for every job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python (activated venv)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (hash-verified lock)
        run: uv sync --all-extras --frozen
      - name: Tests + coverage gate (fail under 80%)
        run: uv run pytest --cov=truejoin --cov-report=term-missing
      - name: The benchmark harness's own tests
        run: uv run pytest bench/tests

  integration:
    name: integration (PostgreSQL + MySQL via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python (activated venv)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (hash-verified lock)
        run: uv sync --all-extras --frozen
      - name: Integration tests against real databases
        # SQL Server and Oracle need their ODBC drivers and skip themselves
        # here; the nightly workflow installs both and requires them.
        run: uv run pytest tests -m integration

  quality:
    name: lint, format, types, lock, chart & docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python (activated venv)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (hash-verified lock)
        run: uv sync --all-extras --frozen
      - name: Ruff (lint)
        run: uv run ruff check truejoin tests bench demo
      - name: Ruff (format)
        run: uv run ruff format --check truejoin tests bench demo
      - name: Mypy (strict)
        run: uv run mypy truejoin
      - name: The lock matches pyproject.toml
        run: uv lock --check
      - name: Helm chart (lint, and the rendering that was reviewed)
        run: make helm-check
      - name: Documentation builds, strictly
        run: uv run mkdocs build --strict

  smoke:
    name: release smoke (the built image, production mode, real PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image, start docker/smoke, run scripts/smoke.py
        run: make smoke
      # The command the README gives a newcomer, on a real Docker. It builds
      # the same image, whose layers the step above has cached.
      - name: The sample setup starts with its one command, and answers
        run: make demo-check

  security:
    name: dependency audit (what the image installs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python (activated venv)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (hash-verified lock)
        run: uv sync --all-extras --frozen
      - name: pip-audit against the locked runtime set
        run: |
          uv export --frozen --no-dev --extra odbc --extra llm --no-emit-project \
            --format requirements-txt -o /tmp/req.txt
          uv run pip-audit --no-deps --disable-pip -r /tmp/req.txt
