<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="truejoin-key-header" content="{{KEY_HEADER}}">
<meta name="truejoin-api-prefix" content="{{API_PREFIX}}">
<meta name="truejoin-mcp-path" content="{{MCP_PATH}}">
<title>Truejoin console</title>
<link rel="stylesheet" href="/ui/vendor/plex/plex.css">
<link rel="stylesheet" href="/ui/vendor/carbon/themes.css">
<link rel="stylesheet" href="/ui/console.css">
<script src="/ui/theme.js"></script>
<script type="module" src="/ui/vendor/carbon/ui-shell.min.js"></script>
<script type="module" src="/ui/vendor/carbon/button.min.js"></script>
<script type="module" src="/ui/vendor/carbon/tag.min.js"></script>
<script type="module" src="/ui/vendor/carbon/modal.min.js"></script>
<script src="/ui/carbon.js" defer></script>
<script src="/ui/console.js" defer></script>
<script src="/ui/results.js" defer></script>
<script src="/ui/catalog.js" defer></script>
<script src="/ui/ontology.js" defer></script>
<script src="/ui/docs.js" defer></script>
<script src="/ui/audit.js" defer></script>
<script src="/ui/keys.js" defer></script>
<script src="/ui/databases.js" defer></script>
<script src="/ui/settings.js" defer></script>
</head>
<body>
<cds-header aria-label="Truejoin console">
  <cds-header-menu-button button-label-active="Close menu" button-label-inactive="Open menu"></cds-header-menu-button>
  <cds-header-name href="/ui" prefix="Truejoin">console</cds-header-name>
  <cds-header-nav menu-bar-label="Views">
    <cds-header-nav-item id="tab-query" href="#query" is-active>Query</cds-header-nav-item>
    <cds-header-nav-item id="tab-catalog" href="#catalog">Catalog</cds-header-nav-item>
    <cds-header-nav-item id="tab-audit" href="#audit">Audit</cds-header-nav-item>
    <cds-header-nav-item id="tab-keys" href="#keys">Keys</cds-header-nav-item>
    <cds-header-nav-item id="tab-databases" href="#databases">Databases</cds-header-nav-item>
    <cds-header-nav-item id="tab-settings" href="#settings">Settings</cds-header-nav-item>
    <cds-header-nav-item id="tab-docs" href="#docs">Docs</cds-header-nav-item>
  </cds-header-nav>
  <form id="auth" class="header-auth" aria-label="Your API key">
    <label for="key" class="sr-only">API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="API key or sign-in token">
    <cds-button id="connect" size="sm" kind="primary">Connect</cds-button>
    <cds-button id="sign-in" size="sm" kind="secondary" hidden>Sign in</cds-button>
  </form>
</cds-header>
<cds-side-nav aria-label="Views" collapse-mode="responsive" is-not-persistent>
  <cds-side-nav-items>
    <cds-side-nav-link id="side-query" href="#query" active>Query</cds-side-nav-link>
    <cds-side-nav-link id="side-catalog" href="#catalog">Catalog</cds-side-nav-link>
    <cds-side-nav-link id="side-audit" href="#audit">Audit</cds-side-nav-link>
    <cds-side-nav-link id="side-keys" href="#keys">Keys</cds-side-nav-link>
    <cds-side-nav-link id="side-databases" href="#databases">Databases</cds-side-nav-link>
    <cds-side-nav-link id="side-settings" href="#settings">Settings</cds-side-nav-link>
    <cds-side-nav-link id="side-docs" href="#docs">Docs</cds-side-nav-link>
  </cds-side-nav-items>
</cds-side-nav>

<main id="view-query" role="tabpanel" aria-labelledby="tab-query">
  <nav id="tables" aria-label="Sources and tables"></nav>
  <section aria-label="Query">
    <fieldset class="modes">
      <legend class="sr-only">Ask with</legend>
      <label><input type="radio" name="mode" value="sql" checked> SQL</label>
      <label><input type="radio" name="mode" value="question"> Question</label>
    </fieldset>
    <textarea id="input" rows="8" spellcheck="false" aria-label="Query text"></textarea>
    <div class="bar">
      <cds-button id="run" size="md">Run</cds-button>
      <span class="muted">Ctrl+Enter</span>
      <label class="check" id="follow-label" hidden><input type="checkbox" id="follow"> Follow up on the last answer</label>
      <span id="status" role="status"></span>
    </div>
    <details class="history">
      <summary>Recent queries <span class="muted">(kept in this browser only)</span></summary>
      <ul id="history" class="plain"></ul>
    </details>
    <div id="notes"></div>
    <div id="result"></div>
  </section>
</main>

<main id="view-catalog" role="tabpanel" aria-labelledby="tab-catalog" hidden>
  <nav aria-label="Catalogs and tables">
    <input id="catalog-q" class="field search" type="search" placeholder="Search tables, columns, terms…" aria-label="Search the catalogs">
    <div id="catalogs"></div>
  </nav>
  <section aria-label="Review">
    <div id="catalog-head"></div>
    <p id="catalog-status" role="status"></p>
    <div id="catalog-table"><p class="muted empty">Pick a table to review.</p></div>
  </section>
</main>

<main id="view-audit" role="tabpanel" aria-labelledby="tab-audit" hidden>
  <nav id="audit-filters" aria-label="Audit filters"></nav>
  <section aria-label="Audit trail">
    <p id="audit-status" class="muted" role="status"></p>
    <div id="audit-body"></div>
  </section>
</main>

<main id="view-keys" role="tabpanel" aria-labelledby="tab-keys" hidden>
  <nav id="keys-filters" aria-label="Hand out a key"></nav>
  <section aria-label="API keys">
    <p id="keys-status" class="muted" role="status"></p>
    <div id="keys-secret"></div>
    <div id="keys-body"></div>
  </section>
</main>

<main id="view-databases" role="tabpanel" aria-labelledby="tab-databases" hidden>
  <nav id="databases-form" aria-label="Add or change a database"></nav>
  <section aria-label="Databases">
    <p id="databases-status" class="muted" role="status"></p>
    <div id="databases-body"></div>
  </section>
</main>

<main id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
  <nav id="settings-nav" aria-label="Settings sections"></nav>
  <section aria-label="Settings">
    <p id="settings-status" class="muted" role="status"></p>
    <div id="settings-body"></div>
  </section>
</main>

<main id="view-docs" role="tabpanel" aria-labelledby="tab-docs" hidden>
  <nav id="docs-nav" aria-label="Reference sections"></nav>
  <section id="docs-body" aria-label="Reference"></section>
</main>
</body>
</html>
