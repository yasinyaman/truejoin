site_name: Truejoin
site_description: Governed access to corporate databases for AI agents and LLMs, an MCP server, REST API and DuckDB OLAP with row-level security, column masking and an audit trail on every query
site_author: Yasin Yaman
# Gives each page its canonical URL and the build a sitemap.xml; change it if
# the site is served from a custom domain.
site_url: https://yasinyaman.github.io/truejoin/
repo_url: https://github.com/yasinyaman/truejoin
repo_name: yasinyaman/truejoin
edit_uri: edit/main/docs/docs/
docs_dir: docs/docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Deployment: deployment.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Measures from the query history: query-history.md
  - Running a pilot: pilot.md
  - Architecture Decisions:
      - Overview: adr/README.md
      - 1. Layered architecture: adr/0001-layered-architecture.md
      - 2. Fail-safe production config: adr/0002-fail-safe-production-config.md
      - 3. Dependency management: adr/0003-dependency-management.md
      - 4. LLM sample-data privacy: adr/0004-llm-sample-data-privacy.md
      - 5. CI quality gates: adr/0005-ci-quality-gates.md
      - 6. Distribution name: adr/0006-distribution-name.md
      - 7. Hexagonal architecture: adr/0007-hexagonal-architecture.md
      - 8. Dialect abstraction & ODBC adapter: adr/0008-dialect-abstraction-and-odbc-adapter.md
      - 9. Governance: adr/0009-governance.md
      - 10. One package, one process: adr/0010-one-package-one-process.md
      - 11. The sync/async bridge: adr/0011-sync-async-bridge.md
      - 12. Access by rewriting the query: adr/0012-access-rewrite.md
      - 13. The certified gate: adr/0013-certified-gate.md
  - API Reference: reference.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            heading_level: 2
